name: Atualizar eventos (diário 9h)

on:
  schedule:
    # O GitHub não garante o horário dos agendamentos (pode atrasar ou pular, principalmente na
    # hora cheia). Por isso: horário principal 9h07 (Brasília) e duas tentativas de reserva.
    # A reserva só coleta se a atualização do dia ainda não tiver sido feita (job "check").
    - cron: "7 12 * * *"    # 09:07 em Brasília (UTC-3)
    - cron: "37 13 * * *"   # 10:37 — reserva
    - cron: "17 16 * * *"   # 13:17 — reserva
  workflow_dispatch:      # botão "Run workflow" para rodar manualmente
    inputs:
      offline:
        description: "Só republicar o site, sem coletar de novo"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]
    paths: ["docs/**", "data/**", "config/**", "scraper/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  # Nas execuções agendadas, pula se a atualização automática de hoje já foi feita.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY'
          import datetime, json, os
          try:
              hist = json.load(open("data/update_history.json"))
          except Exception:
              hist = []
          hoje = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=3)).date().isoformat()
          feita = any(h.get("trigger") == "automatica" and h.get("mode") == "coleta" and h.get("at", "").startswith(hoje) for h in hist)
          print("atualização de hoje já feita" if feita else "atualização de hoje pendente")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"skip={'true' if feita else 'false'}\n")
          PY

  update:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo, para a aba Admin (histórico de melhorias)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q tests

      - name: Coletar eventos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MAX_CALLS: ${{ vars.AI_MAX_CALLS || '10' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.offline }}" = "true" ]; then
            python -m scraper.main --offline
          else
            python -m scraper.main
          fi

      - name: Salvar dados no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data/events.json data/search_cache.json data/enrich_cache.json data/geocache.json data/update_history.json data/news_cache.json
          git diff --cached --quiet || git commit -m "Atualiza eventos $(TZ=America/Sao_Paulo date +'%Y-%m-%d %H:%M')"
          # se outra execução salvou antes, reaplica por cima mantendo os dados desta coleta
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs || exit 1; done

      - name: Gerar histórico de atualizações (aba Admin)
        run: python -m scraper.changelog

      # Prepara o site para o GitHub Pages (Settings > Pages > Source: GitHub Actions).
      # Se o Pages não estiver ativado, estes passos falham sem derrubar a coleta.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
    outputs:
      pages: ${{ steps.pages.outcome }}

  deploy:
    needs: update
    if: needs.update.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
